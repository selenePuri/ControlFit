<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Devoluciones')}"></head>
<body>
<div class="dashboard-container">
    <aside th:replace="~{fragments :: sidebarAdmin('devoluciones')}"></aside>
    <main class="main-content">
        <header th:replace="~{fragments :: topbar('Módulo de Devoluciones', 'Devoluciones de dinero sobre pagos existentes (independientes de la cancelación de membresías)', 'ADMIN', 'fa-shield-halved')}"></header>
        <div th:replace="~{fragments :: flash}"></div>

        <div class="controls-bar">
            <span class="muted" th:text="${#lists.size(devoluciones)} + ' devolución(es)'">0</span>
            <button type="button" class="btn-primary" data-modal-open="modalDevolucion"><i class="fa-solid fa-rotate-left"></i> Nueva Devolución</button>
        </div>

        <div class="table-container">
            <table data-buscable>
                <thead><tr><th>ID</th><th>Pago</th><th>Cliente</th><th>Fecha</th><th>Importe</th><th>Motivo</th><th>Estado</th><th>Acciones</th></tr></thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(devoluciones)}"><td colspan="8" class="center muted">No hay devoluciones registradas.</td></tr>
                <tr th:each="d : ${devoluciones}">
                    <td th:text="'#D' + ${d.idDevolucion}">#D1</td>
                    <td th:text="'#P' + ${d.pago.idPago}">#P1</td>
                    <td th:text="${d.pago.membresia.cliente.nombres} + ' ' + ${d.pago.membresia.cliente.apellidos}">Cliente</td>
                    <td th:text="${#temporals.format(d.fechaDevolucion, 'yyyy-MM-dd HH:mm')}">2026-01-01 10:00</td>
                    <td>S/ <span th:text="${#numbers.formatDecimal(d.monto, 1, 'COMMA', 2, 'POINT')}">0.00</span></td>
                    <td th:text="${d.motivo != null} ? ${d.motivo} : '-'">-</td>
                    <td><span th:class="${d.estado.name() == 'COMPLETADA'} ? 'status-active' : 'status-inactive'" th:text="${d.estado}">COMPLETADA</span></td>
                    <td>
                        <div class="acciones" th:if="${d.estado.name() == 'PENDIENTE'}">
                            <form th:action="@{/admin/devoluciones/{id}/completar(id=${d.idDevolucion})}" method="post" data-una-vez>
                                <button type="submit" class="btn-small">Completar</button></form>
                            <form th:action="@{/admin/devoluciones/{id}/anular(id=${d.idDevolucion})}" method="post" data-una-vez
                                  data-confirmar="¿Anular esta devolución pendiente? El saldo del pago volverá a estar disponible.">
                                <button type="submit" class="btn-small">Anular</button></form>
                        </div>
                        <span th:unless="${d.estado.name() == 'PENDIENTE'}" class="muted">—</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<div id="modalDevolucion" class="modal-overlay" th:attr="data-autoabrir=${abrirFormulario != null}">
    <div class="modal-box">
        <h3>Registrar Devolución</h3>
        <p class="muted" th:if="${#lists.isEmpty(pagosDevolubles)}">No hay pagos con saldo por devolver.</p>
        <form th:unless="${#lists.isEmpty(pagosDevolubles)}" th:action="@{/admin/devoluciones}" th:object="${form}" method="post" data-una-vez>
            <div class="field"><label>Pago</label>
                <select th:field="*{idPago}" required>
                    <option value="">— Seleccione —</option>
                    <option th:each="p : ${pagosDevolubles}" th:value="${p.idPago}"
                            th:text="'#P' + ${p.idPago} + ' · ' + ${p.membresia.cliente.nombres} + ' ' + ${p.membresia.cliente.apellidos}
                                     + ' · pagó S/ ' + ${#numbers.formatDecimal(p.monto, 1, 'COMMA', 2, 'POINT')}
                                     + ' · saldo S/ ' + ${#numbers.formatDecimal(saldos[p.idPago].saldo, 1, 'COMMA', 2, 'POINT')}">pago</option>
                </select></div>
            <div class="row2">
                <div class="field"><label>Importe a devolver (S/)</label>
                    <input type="number" step="0.01" min="0.01" th:field="*{monto}" required></div>
                <div class="field"><label>Estado</label>
                    <select th:field="*{estado}">
                        <option th:each="e : ${estadosIniciales}" th:value="${e}"
                                th:text="${e.name() == 'COMPLETADA'} ? 'COMPLETADA (dinero ya devuelto)' : 'PENDIENTE (por entregar)'">COMPLETADA</option>
                    </select></div>
            </div>
            <div class="field"><label>Motivo (opcional)</label>
                <input type="text" th:field="*{motivo}" maxlength="200" placeholder="Ej.: cancelación de membresía"></div>
            <p class="muted" style="font-size:12px;">El importe no puede superar el saldo disponible del pago. El pago original no se modifica.</p>
            <div class="modal-actions">
                <button type="button" class="btn-ghost" data-modal-close>Cancelar</button>
                <button type="submit" class="btn-save">Registrar devolución</button>
            </div>
        </form>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
